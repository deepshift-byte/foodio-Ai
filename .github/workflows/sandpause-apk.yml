name: SandPause APK

# Builds the SandPause debug APK and runs the pure-Kotlin unit tests.
# GitHub-hosted runners can reach Google's Maven repository, which the
# development sandbox cannot, so the APK is produced here.

on:
  push:
    branches: [claude/lucid-euler-v9ppyx]
    paths:
      - 'sandpause/**'
      - '.github/workflows/sandpause-apk.yml'
  pull_request:
    paths:
      - 'sandpause/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SandPause APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sandpause

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform and build tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Unit tests (core logic)
        timeout-minutes: 15
        run: ./gradlew :core:test --no-daemon --console=plain --stacktrace

      - name: Build debug APK and compile instrumented tests
        timeout-minutes: 25
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain --stacktrace

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SandPause-debug-apk
          path: sandpause/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
